name: Отчет о дефекте
description: Шаблон для оформления отчета об обнаруженном дефекте
title: "[Ошибка]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## Спасибо, что помогаете улучшить приложение!
        Заполните все поля максимально подробно.

  - type: checkboxes
    id: existing_issues
    attributes:
      label: Проверка существующих отчетов
      description: Убедитесь, что похожий дефект еще не зарегистрирован.
      options:
        - label: Я ознакомился с существующими отчетами и не нашел дубликата
          required: true

  - type: textarea
    id: title_field
    attributes:
      label: Заголовок
      description: Кратко сформулируйте суть дефекта
      placeholder: 'Например, "Кнопка «Войти» не реагирует"'
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Описание
      description: Подробно опишите проблему
    validations:
      required: true

  - type: textarea
    id: preconditions
    attributes:
      label: Предусловия
      description: Что должно быть выполнено перед воспроизведением
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Пошагово опишите действия
      placeholder: |
        1. Открыть страницу ...
        2. Нажать на ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
      description: Что должно происходить
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Фактический результат
      description: Что происходит на самом деле
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Скриншоты / Доп. материалы
      description: Прикрепите скриншоты или логи
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Приоритет
      description: Насколько срочно нужно исправить
      options:
        - Низкий
        - Средний
        - Высокий
        - Критический
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Серьезность
      description: Насколько серьезен дефект
      options:
        - Trivial (косметический)
        - Minor (незначительный)
        - Major (значительный)
        - Critical (критический)
        - Blocker (блокирующий)
    validations:
      required: true
